# Supply-chain guard: skip package versions published less than 24h ago.
# pnpm's minimumReleaseAge is expressed in minutes (86400s = 1440min).
minimumReleaseAge: 1440
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExclude:
  - "@lovable.dev/vite-tanstack-config"
  - "@lovable.dev/mcp-js"
  - "@lovable.dev/vite-plugin-dev-server-bridge"
  - "@lovable.dev/vite-plugin-hmr-gate"
  - "@lovable.dev/email-js"
  - "@lovable.dev/webhooks-js"
